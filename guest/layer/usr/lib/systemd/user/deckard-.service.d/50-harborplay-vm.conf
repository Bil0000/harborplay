# harborplay: prefix drop-in (like app-steam-.scope.d): Steam Frame hardware and SteamOS VR units,
# also ones a SteamOS update renames or adds that masks.d does not list yet, do not run in the
# VM. /run/harborplay/slot is written by the harborplay initramfs on every VM boot.
[Unit]
ConditionPathExists=!/run/harborplay/slot
